name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # `npm publish --provenance` 需要，用于把 npm 包绑定到本次构建

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm install

      # prepublishOnly 里已挂 `npm test`，测试通过才会真正发布
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}